<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম অ্যাডমিন প্যানেল</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Admin Login Screen -->
    <div id="admin-login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 border">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">অ্যাডমিন প্যানেল লগইন</h1>
                <p class="text-xs text-gray-500">জিমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
            </div>
            <form onsubmit="adminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">অ্যাডমিন জিমেইল *</label>
                    <input type="email" id="admin-email" required placeholder="admin43214@gmail.com" class="w-full border rounded-xl p-3 text-xs outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">অ্যাডমিন পাসওয়ার্ড *</label>
                    <input type="password" id="admin-pass" required placeholder="পাসওয়ার্ড দিন" class="w-full border rounded-xl p-3 text-xs outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg uppercase tracking-wide">
                    লগইন করুন
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden min-h-screen pb-10">
        <header class="bg-indigo-900 text-white shadow-md">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-gauge text-xl text-orange-400"></i>
                    <h1 class="font-bold text-base">ই-শপ অ্যাডমিন ড্যাশবোর্ড</h1>
                </div>
                <button onclick="adminLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    <i class="fas fa-sign-out-alt mr-1"></i> লগআউট
                </button>
            </div>
        </header>

        <div class="container mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Side: Add / Edit Product Form -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border h-fit">
                <h2 id="form-title" class="text-sm font-bold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-indigo-600"></i> নতুন পণ্য যুক্ত করুন
                </h2>
                <form onsubmit="handleProductSubmit(event)" class="space-y-3">
                    <input type="hidden" id="edit-prod-id" value="">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">পণ্যের কোড / ID *</label>
                        <input type="text" id="p-code" required placeholder="যেমন: PROD-101" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-1 focus:ring-indigo-600 font-bold">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">পণ্যের নাম *</label>
                        <input type="text" id="p-name" required placeholder="যেমন: বই / স্মার্ট ওয়াচ" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">মূল্য (টাকা) *</label>
                        <input type="number" id="p-price" required placeholder="যেমন: ১২০০" class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">গ্যালারি থেকে ছবি সিলেক্ট করুন <span id="img-req-text" class="text-red-500">*</span></label>
                        <input type="file" id="p-img-file" accept="image/*" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">ক্যাটাগরি *</label>
                        <select id="p-cat" required class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-1 focus:ring-indigo-600">
                            <option value="mobile">মোবাইল</option>
                            <option value="fashion">ফ্যাশন</option>
                            <option value="gadget">গ্যাজেট</option>
                            <option value="watch">ঘড়ি</option>
                            <option value="others">অন্যান্য (বই, ইত্যাদি)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">পণ্যের বিবরণ *</label>
                        <textarea id="p-desc" required rows="2" placeholder="পণ্যের বিস্তারিত বিবরণ..." class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-1 focus:ring-indigo-600"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md uppercase tracking-wide">
                            পাবলিশ করুন
                        </button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-bold px-4 rounded-xl text-xs transition">
                            বাতিল
                        </button>
                    </div>
                </form>

                <!-- Published Products Management Section -->
                <div class="mt-8 border-t pt-4">
                    <h3 class="text-xs font-bold text-gray-800 mb-3 flex justify-between items-center">
                        <span><i class="fas fa-boxes-stacked text-indigo-600 mr-1"></i> প্রকাশিত পণ্যসমূহ</span>
                        <span id="product-count" class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-bold">০ টি</span>
                    </h3>
                    <div id="published-products-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <!-- Right Side: Orders Management (User Orders vs Admin Orders) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border lg:col-span-2">
                <div class="flex justify-between items-center border-b pb-3 mb-4 flex-wrap gap-2">
                    <!-- Tabs Header -->
                    <div class="flex space-x-2">
                        <button onclick="switchTab('users')" id="tab-btn-users" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm transition">
                            <i class="fas fa-users mr-1"></i> কাস্টমার অর্ডারসমূহ
                        </button>
                        <button onclick="switchTab('admin')" id="tab-btn-admin" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition">
                            <i class="fas fa-user-shield mr-1"></i> অ্যাডমিন নিজের অর্ডার
                        </button>
                    </div>
                    <button onclick="loadAdminOrders()" class="text-xs text-indigo-600 hover:underline"><i class="fas fa-rotate"></i> রিফ্রেশ</button>
                </div>

                <!-- Orders List Display -->
                <div id="admin-orders-container" class="space-y-3 overflow-y-auto max-h-[600px]"></div>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <!-- Admin JavaScript Engine with Firebase Connected -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBWkT-C2CEJRTcgZoAVx1Bcxrx0zMCxTtA",
            authDomain: "my-eshop-app-e65ec.firebaseapp.com",
            projectId: "my-eshop-app-e65ec",
            storageBucket: "my-eshop-app-e65ec.firebasestorage.app",
            messagingSenderId: "92808609246",
            appId: "1:92808609246:web:4b818a50e85633dac7f14f",
            measurementId: "G-58EWGN2NHL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentTab = 'users';
        let products = [];
        let orders = [];

        // Realtime Data Sync from Firebase
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            products = data ? Object.values(data) : [];
            loadPublishedProducts();
        });

        db.ref('orders').on('value', (snapshot) => {
            const data = snapshot.val();
            orders = data ? Object.values(data) : [];
            loadAdminOrders();
        });

        function adminLogin(e) {
            e.preventDefault();
            const inputEmail = document.getElementById('admin-email').value.trim();
            const inputPass = document.getElementById('admin-pass').value;

            if(inputEmail === 'admin43214@gmail.com' && inputPass === '0987654321@#৳%&*-+()') {
                localStorage.setItem('is_admin_logged', 'true');
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else {
                alert('ভুল জিমেইল অথবা পাসওয়ার্ড!');
            }
        }

        function adminLogout() {
            localStorage.removeItem('is_admin_logged');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login-screen').classList.remove('hidden');
        }

        window.onload = function() {
            if(localStorage.getItem('is_admin_logged') === 'true') {
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            if(tab === 'users') {
                document.getElementById('tab-btn-users').className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm transition';
                document.getElementById('tab-btn-admin').className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition';
            } else {
                document.getElementById('tab-btn-admin').className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm transition';
                document.getElementById('tab-btn-users').className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition';
            }
            loadAdminOrders();
        }

        // --- PRODUCT MANAGEMENT (Add & Edit) ---
        function handleProductSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-prod-id').value;
            const fileInput = document.getElementById('p-img-file');
            const file = fileInput.files[0];

            if(editId) { // Edit existing product
                const p = products.find(item => item.id == editId);
                if(p) {
                    p.code = document.getElementById('p-code').value;
                    p.name = document.getElementById('p-name').value;
                    p.price = Number(document.getElementById('p-price').value);
                    p.category = document.getElementById('p-cat').value;
                    p.desc = document.getElementById('p-desc').value;

                    if(file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            p.img = event.target.result;
                            db.ref('products/' + p.id).set(p);
                            alert('পণ্যটির তথ্য আপডেট করা হয়েছে!');
                            resetForm();
                        };
                        reader.readAsDataURL(file);
                    } else {
                        db.ref('products/' + p.id).set(p);
                        alert('পণ্যটির তথ্য আপডেট করা হয়েছে!');
                        resetForm();
                    }
                }
            } else { // Add new product
                if(!file) {
                    alert('নতুন পণ্যের জন্য ছবি দেওয়া বাধ্যতামূলক!');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    const prodId = Date.now();
                    const newProduct = {
                        id: prodId,
                        code: document.getElementById('p-code').value,
                        name: document.getElementById('p-name').value,
                        price: Number(document.getElementById('p-price').value),
                        img: event.target.result,
                        category: document.getElementById('p-cat').value,
                        desc: document.getElementById('p-desc').value
                    };

                    db.ref('products/' + prodId).set(newProduct);
                    alert('পণ্যটি সফলভাবে যুক্ত করা হয়েছে!');
                    resetForm();
                };
                reader.readAsDataURL(file);
            }
        }

        function loadPublishedProducts() {
            const list = document.getElementById('published-products-list');
            const count = document.getElementById('product-count');

            count.innerText = products.length + ' টি';
            list.innerHTML = '';

            if(products.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-[11px] text-center py-2">কোনো পণ্য নেই</p>';
                return;
            }

            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border text-xs">
                        <div class="flex items-center space-x-2">
                            <img src="${p.img}" class="w-8 h-8 object-cover rounded">
                            <div>
                                <p class="font-bold text-gray-800 line-clamp-1">${p.name}</p>
                                <p class="text-[10px] text-gray-500">ID: ${p.code} | ৳${p.price}</p>
                            </div>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="editProduct(${p.id})" class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200">এডিট</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-100 text-red-600 px-2 py-1 rounded font-bold hover:bg-red-200">ডিলিট</button>
                        </div>
                    </div>
                `;
            });
        }

        function editProduct(id) {
            const p = products.find(item => item.id == id);
            if(!p) return;

            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('p-code').value = p.code || '';
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-cat').value = p.category;
            document.getElementById('p-desc').value = p.desc;

            document.getElementById('form-title').innerHTML = '<i class="fas fa-pen-to-square text-indigo-600"></i> পণ্যটি এডিট করুন';
            document.getElementById('save-btn').innerText = 'আপডেট করুন';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            document.getElementById('img-req-text').innerText = '(ঐচ্ছিক)';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-prod-id').value = '';
            document.getElementById('p-code').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-img-file').value = '';
            document.getElementById('p-desc').value = '';
            document.getElementById('form-title').innerHTML = '<i class="fas fa-plus-circle text-indigo-600"></i> নতুন পণ্য যুক্ত করুন';
            document.getElementById('save-btn').innerText = 'পাবলিশ করুন';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('img-req-text').innerText = '*';
        }

        function deleteProduct(id) {
            if(confirm('আপনি কি এই পণ্যটি মুছে ফেলতে চান?')) {
                db.ref('products/' + id).remove();
            }
        }

        // --- ORDER MANAGEMENT (History & Status Updates) ---
        function loadAdminOrders() {
            const container = document.getElementById('admin-orders-container');
            const filteredOrders = orders.filter(o => {
                if(currentTab === 'admin') return o.isAdminOrder === true;
                return !o.isAdminOrder;
            });

            container.innerHTML = '';
            if(filteredOrders.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-xs py-8">${currentTab === 'admin' ? 'অ্যাডমিনের কোনো অর্ডার হিস্ট্রি নেই!' : 'কাস্টমারদের কোনো অর্ডার হিস্ট্রি নেই!'}</p>`;
                return;
            }

            filteredOrders.forEach((ord) => {
                let itemsListHtml = '';
                if(ord.items) {
                    ord.items.forEach(item => {
                        itemsListHtml += `<li class="text-gray-700">📦 <strong>[ID: ${item.code || 'N/A'}]</strong> ${item.name} x ${item.qty} (৳${item.price * item.qty})</li>`;
                    });
                }

                container.innerHTML += `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-xs space-y-2">
                        <div class="flex justify-between items-center font-bold text-gray-800 border-b pb-1.5">
                            <span>অর্ডার আইডি: ${ord.id}</span>
                            <span class="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">${ord.status}</span>
                        </div>
                        <div>
                            <p class="font-bold text-indigo-900 border-b pb-1 mb-1">অর্ডারকৃত পণ্যসমূহ:</p>
                            <ul class="space-y-1 pl-1">${itemsListHtml}</ul>
                        </div>
                        <div class="pt-1 text-gray-600 border-t space-y-0.5">
                            <p><strong>গ্রাহকের নাম:</strong> ${ord.name} (${ord.phone})</p>
                            <p><strong>ঠিকানা & জেলা:</strong> ${ord.district}, ${ord.address}</p>
                            <p><strong>পেমেন্ট পদ্ধতি:</strong> ${ord.payment.toUpperCase()} | <strong>TrxID:</strong> ${ord.trx}</p>
                            <p><strong>বিশেষ নোট:</strong> ${ord.note}</p>
                        </div>
                        
                        <!-- Order Status Selector -->
                        <div class="pt-2 border-t flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center space-x-2">
                                <label class="font-bold text-gray-700">স্ট্যাটাস পরিবর্তন:</label>
                                <select onchange="updateOrderStatus('${ord.id}', this.value)" class="border rounded-lg p-1 text-xs font-semibold bg-white outline-none focus:ring-1 focus:ring-indigo-600">
                                    <option value="প্রক্রিয়াধীন (Processing)" ${ord.status.includes('Processing') || ord.status.includes('প্রক্রিয়াধীন') ? 'selected' : ''}>প্রক্রিয়াধীন (Processing)</option>
                                    <option value="প্যাকিং সম্পন্ন (Packed)" ${ord.status.includes('Packed') ? 'selected' : ''}>প্যাকিং সম্পন্ন (Packed)</option>
                                    <option value="কুরিয়ারে হস্তান্তর (Shipped)" ${ord.status.includes('Shipped') ? 'selected' : ''}>কুরিয়ারে হস্তান্তর (Shipped)</option>
                                    <option value="ডেলিভারির জন্য বের হয়েছে (Out for Delivery)" ${ord.status.includes('Out for Delivery') ? 'selected' : ''}>ডেলিভারির জন্য বের হয়েছে (Out for Delivery)</option>
                                    <option value="ডেলিভারি সম্পন্ন (Delivered)" ${ord.status.includes('Delivered') || ord.status.includes('সম্পন্ন') ? 'selected' : ''}>ডেলিভারি সম্পন্ন (Delivered)</option>
                                    <option value="বাতিল করা হয়েছে (Cancelled)" ${ord.status.includes('Cancelled') ? 'selected' : ''}>বাতিল (Cancelled)</option>
                                </select>
                            </div>
                            <button onclick="deleteSingleOrder('${ord.id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg font-bold">
                                <i class="fas fa-trash-can mr-1"></i> ডিলিট
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function updateOrderStatus(orderId, newStatus) {
            db.ref('orders/' + orderId).update({ status: newStatus });
            alert('অর্ডারের স্ট্যাটাস সফলভাবে আপডেট করা হয়েছে!');
        }

        function deleteSingleOrder(orderId) {
            if(confirm('আপনি কি এই অর্ডার হিস্ট্রি মুছে ফেলতে চান?')) {
                db.ref('orders/' + orderId).remove();
            }
        }
    </script>
</body>
</html>
